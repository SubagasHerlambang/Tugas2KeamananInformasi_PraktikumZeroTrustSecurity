$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  X-Device-ID: DEV-MHS-001
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "mhs.001",
      "password": "salah"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 401', () => pm.response.to.have.status(401));
      pm.test('error.code = INVALID_CREDENTIALS', () => pm.expect(pm.response.json().error.code).to.eql('INVALID_CREDENTIALS'));
    language: text/javascript
order: 1000
