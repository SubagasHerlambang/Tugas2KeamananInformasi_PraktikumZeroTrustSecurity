$kind: http-request
name: "[TC-SVC-02] Token service: secret salah"
url: "{{baseUrl}}/auth/service"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "client_id": "service-nilai",
      "client_secret": "salah"
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 12000
