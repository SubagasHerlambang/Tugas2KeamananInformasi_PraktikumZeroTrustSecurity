$kind: http-request
url: "{{baseUrl}}/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "refresh_token": "{{refMhs1}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 11000
