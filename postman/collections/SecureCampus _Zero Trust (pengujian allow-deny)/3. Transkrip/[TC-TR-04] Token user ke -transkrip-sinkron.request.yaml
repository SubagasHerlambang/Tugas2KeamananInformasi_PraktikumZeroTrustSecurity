$kind: http-request
name: "[TC-TR-04] Token user ke /transkrip/sinkron"
url: "{{baseUrl}}/transkrip/sinkron"
method: POST
headers:
  Authorization: Bearer {{tokMhs1}}
  X-Device-ID: DEV-MHS-001
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "grade_id": "GRD-501-001"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', () => pm.response.to.have.status(403));
      pm.test('error.code = SERVICE_TOKEN_REQUIRED', () => pm.expect(pm.response.json().error.code).to.eql('SERVICE_TOKEN_REQUIRED'));
    language: text/javascript
order: 6000
