$kind: http-request
url: "{{baseUrl}}/nilai"
method: GET
headers:
  Authorization: Bearer {{tokMhs1}}
  X-Device-ID: DEV-MHS-001
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('hanya NIM sendiri', () => pm.response.json().data.every(g => g.student_nim === '247006110001'));
    language: text/javascript
order: 1000
