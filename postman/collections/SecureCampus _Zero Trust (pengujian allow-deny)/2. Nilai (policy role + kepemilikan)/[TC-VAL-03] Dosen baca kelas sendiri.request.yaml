$kind: http-request
url: "{{baseUrl}}/nilai"
method: GET
headers:
  Authorization: Bearer {{tokAndi}}
  X-Device-ID: DEV-DOSEN-001
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('hanya CLS-501', () => pm.response.json().data.every(g => g.class_id === 'CLS-501'));
    language: text/javascript
order: 2000
