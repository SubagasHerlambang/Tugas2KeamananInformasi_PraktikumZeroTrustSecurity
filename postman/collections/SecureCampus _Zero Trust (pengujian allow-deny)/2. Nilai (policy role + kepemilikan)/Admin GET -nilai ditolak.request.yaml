$kind: http-request
name: Admin GET /nilai ditolak
url: "{{baseUrl}}/nilai"
method: GET
headers:
  Authorization: Bearer {{tokAdmin}}
  X-Device-ID: DEV-ADMIN-001
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: pm.test('HTTP 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000
