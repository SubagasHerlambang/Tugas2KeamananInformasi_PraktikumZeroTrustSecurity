$kind: http-request
url: "{{baseUrl}}/kelas/CLS-502/finalisasi"
method: POST
headers:
  Authorization: Bearer {{tokAndi}}
  X-Device-ID: DEV-DOSEN-001
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', () => pm.response.to.have.status(403));
      pm.test('error.code = CLASS_NOT_OWNED', () => pm.expect(pm.response.json().error.code).to.eql('CLASS_NOT_OWNED'));
    language: text/javascript
order: 1000
